name: T-Rex Terminal Build

on:
  push:
    branches:
      - trex
  pull_request:
    branches:
      - trex
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.package_variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_variant: [apt-android-7, apt-android-5]

    steps:
      - name: Checkout T-Rex source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and validate APKs
        shell: bash
        env:
          PACKAGE_VARIANT: ${{ matrix.package_variant }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BUILD_SHA="${${ github.event.pull_request.head.sha }}"
          else
            BUILD_SHA="$GITHUB_SHA"
          fi

          VERSION_REGEX='\\s+versionName "([^"]+)"$'
          CURRENT_VERSION="$(grep -m 1 -E "$VERSION_REGEX" ./app/build.gradle | sed -r "s/$VERSION_REGEX/\\1/")"
          RELEASE_VERSION="${CURRENT_VERSION}+${BUILD_SHA:0:7}"
          APK_TAG="v${RELEASE_VERSION}-${PACKAGE_VARIANT}-github-debug"
          APK_PREFIX="trex-terminal_$APK_TAG"
          APK_DIR="./app/build/outputs/apk/debug"

          echo "APK_DIR=$APK_DIR" >> "$GITHUB_ENV"
          echo "APK_PREFIX=$APK_PREFIX" >> "$GITHUB_ENV"

          export TERMUX_APP_VERSION_NAME="$RELEASE_VERSION"
          export TERMUX_APK_VERSION_TAG="$APK_TAG"
          export TERMUX_PACKAGE_VARIANT="$PACKAGE_VARIANT"

          ./gradlew assembleDebug

          for abi in universal arm64-v8a armeabi-v7a x86_64 x86; do
            test -f "$APK_DIR/${APK_PREFIX}_$abi.apk" || {
              echo "Missing APK: $APK_DIR/${APK_PREFIX}_$abi.apk"
              ls -la "$APK_DIR"
              exit 1
            }
          done

          (cd "$APK_DIR" && sha256sum \
            "${APK_PREFIX}_universal.apk" \
            "${APK_PREFIX}_arm64-v8a.apk" \
            "${APK_PREFIX}_armeabi-v7a.apk" \
            "${APK_PREFIX}_x86_64.apk" \
            "${APK_PREFIX}_x86.apk" \
            > "${APK_PREFIX}_sha256sums")

      - name: Upload universal APK
        uses: actions/upload-artifact@v6
        with:
          name: trex-universal-${{ matrix.package_variant }}
          path: |
            ${{ env.APK_DIR }}/${{ env.APK_PREFIX }}_universal.apk
            ${{ env.APK_DIR }}/output-metadata.json

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v6
        with:
          name: trex-arm64-v8a-${{ matrix.package_variant }}
          path: |
            ${{ env.APK_DIR }}/${{ env.APK_PREFIX }}_arm64-v8a.apk
            ${{ env.APK_DIR }}/output-metadata.json

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v6
        with:
          name: trex-armeabi-v7a-${{ matrix.package_variant }}
          path: |
            ${{ env.APK_DIR }}/${{ env.APK_PREFIX }}_armeabi-v7a.apk
            ${{ env.APK_DIR }}/output-metadata.json

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v6
        with:
          name: trex-x86_64-${{ matrix.package_variant }}
          path: |
            ${{ env.APK_DIR }}/${{ env.APK_PREFIX }}_x86_64.apk
            ${{ env.APK_DIR }}/output-metadata.json

      - name: Upload x86 APK
        uses: actions/upload-artifact@v6
        with:
          name: trex-x86-${{ matrix.package_variant }}
          path: |
            ${{ env.APK_DIR }}/${{ env.APK_PREFIX }}_x86.apk
            ${{ env.APK_DIR }}/output-metadata.json

      - name: Upload SHA-256 checksums
        uses: actions/upload-artifact@v6
        with:
          name: trex-sha256-${{ matrix.package_variant }}
          path: |
            ${{ env.APK_DIR }}/${{ env.APK_PREFIX }}_sha256sums
            ${{ env.APK_DIR }}/output-metadata.json
