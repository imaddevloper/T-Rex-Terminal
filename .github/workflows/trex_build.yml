name: T-Rex Terminal Build

on:
  push:
    branches:
      - trex
  pull_request:
    branches:
      - trex
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (\u0024{{ matrix.package_variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_variant: [apt-android-7, apt-android-5]

    steps:
      - name: Checkout T-Rex source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and validate APKs
        shell: bash
        env:
          PACKAGE_VARIANT: \u0024{{ matrix.package_variant }}
        run: |
          set -euo pipefail

          if [ "\u0024GITHUB_EVENT_NAME" = "pull_request" ]; then
            BUILD_SHA="\u0024{\u0024{ github.event.pull_request.head.sha }}"
          else
            BUILD_SHA="\u0024GITHUB_SHA"
          fi

          VERSION_REGEX='\\s+versionName "([^"]+)"\u0024'
          CURRENT_VERSION="$(grep -m 1 -E "\u0024VERSION_REGEX" ./app/build.gradle | sed -r "s/\u0024VERSION_REGEX/\\1/")"
          RELEASE_VERSION="\u0024{CURRENT_VERSION}+\u0024{BUILD_SHA:0:7}"
          APK_TAG="v\u0024{RELEASE_VERSION}-\u0024{PACKAGE_VARIANT}-github-debug"
          APK_PREFIX="trex-terminal_\u0024APK_TAG"
          APK_DIR="./app/build/outputs/apk/debug"

          echo "APK_DIR=\u0024APK_DIR" >> "\u0024GITHUB_ENV"
          echo "APK_PREFIX=\u0024APK_PREFIX" >> "\u0024GITHUB_ENV"

          export TERMUX_APP_VERSION_NAME="\u0024RELEASE_VERSION"
          export TERMUX_APK_VERSION_TAG="\u0024APK_TAG"
          export TERMUX_PACKAGE_VARIANT="\u0024PACKAGE_VARIANT"

          ./gradlew assembleDebug

          for abi in universal arm64-v8a armeabi-v7a x86_64 x86; do
            test -f "\u0024APK_DIR/\u0024{APK_PREFIX}_\u0024abi.apk" || {
              echo "Missing APK: \u0024APK_DIR/\u0024{APK_PREFIX}_\u0024abi.apk"
              ls -la "\u0024APK_DIR"
              exit 1
            }
          done

          (cd "\u0024APK_DIR" && sha256sum \
            "\u0024{APK_PREFIX}_universal.apk" \
            "\u0024{APK_PREFIX}_arm64-v8a.apk" \
            "\u0024{APK_PREFIX}_armeabi-v7a.apk" \
            "\u0024{APK_PREFIX}_x86_64.apk" \
            "\u0024{APK_PREFIX}_x86.apk" \
            > "\u0024{APK_PREFIX}_sha256sums")

      - name: Upload universal APK
        uses: actions/upload-artifact@v6
        with:
          name: trex-universal-\u0024{{ matrix.package_variant }}
          path: |
            \u0024{{ env.APK_DIR }}/\u0024{{ env.APK_PREFIX }}_universal.apk
            \u0024{{ env.APK_DIR }}/output-metadata.json

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v6
        with:
          name: trex-arm64-v8a-\u0024{{ matrix.package_variant }}
          path: |
            \u0024{{ env.APK_DIR }}/\u0024{{ env.APK_PREFIX }}_arm64-v8a.apk
            \u0024{{ env.APK_DIR }}/output-metadata.json

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v6
        with:
          name: trex-armeabi-v7a-\u0024{{ matrix.package_variant }}
          path: |
            \u0024{{ env.APK_DIR }}/\u0024{{ env.APK_PREFIX }}_armeabi-v7a.apk
            \u0024{{ env.APK_DIR }}/output-metadata.json

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v6
        with:
          name: trex-x86_64-\u0024{{ matrix.package_variant }}
          path: |
            \u0024{{ env.APK_DIR }}/\u0024{{ env.APK_PREFIX }}_x86_64.apk
            \u0024{{ env.APK_DIR }}/output-metadata.json

      - name: Upload x86 APK
        uses: actions/upload-artifact@v6
        with:
          name: trex-x86-\u0024{{ matrix.package_variant }}
          path: |
            \u0024{{ env.APK_DIR }}/\u0024{{ env.APK_PREFIX }}_x86.apk
            \u0024{{ env.APK_DIR }}/output-metadata.json

      - name: Upload SHA-256 checksums
        uses: actions/upload-artifact@v6
        with:
          name: trex-sha256-\u0024{{ matrix.package_variant }}
          path: |
            \u0024{{ env.APK_DIR }}/\u0024{{ env.APK_PREFIX }}_sha256sums
            \u0024{{ env.APK_DIR }}/output-metadata.json
